# Production stack. Configuration comes from .env.prod (copy .env.prod.example; never
# commit the real file). See docs/deployment.md for the full procedure.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Only nginx ("web") publishes a port. PostgreSQL, Redis and Django are reachable only
# inside this private network. Put a TLS-terminating proxy / load balancer in front of
# the web port (see docs/deployment.md, "HTTPS").

x-app: &app
  build:
    context: ./backend
    target: prod
  image: invoice-automation-backend:${APP_VERSION:-latest}
  env_file: ${ENV_FILE:-.env.prod}
  environment:
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    REDIS_URL: redis://redis:6379
  restart: unless-stopped

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # One-off: applies database migrations, then exits. The web and job containers wait
  # for it to succeed. Running migrations separately (not inside each web container)
  # means two web containers starting at once never race to migrate the same database.
  migrate:
    <<: *app
    command: python manage.py migrate --noinput
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  backend:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *app
    command: celery -A config worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-2}
    healthcheck:
      disable: true # the image's check is for gunicorn; worker health = heartbeat (see /api/v1/health/)
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Exactly ONE beat in the whole deployment: it is the clock. Two would send every
  # scheduled task twice (harmless, as tasks are idempotent, but wasteful).
  beat:
    <<: *app
    command: celery -A config beat --loglevel=info --schedule /tmp/celerybeat-schedule
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build: ./frontend
    image: invoice-automation-web:${APP_VERSION:-latest}
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
