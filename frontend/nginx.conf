# nginx in production: serves the built React app and forwards API/admin traffic to
# Django, so the browser sees ONE origin (session cookie + CSRF work as in development).
#
# TLS (https) is expected to end in front of this, at a load balancer or a TLS proxy,
# which sets X-Forwarded-Proto. See docs/deployment.md.

# The scheme the visitor actually used: from the proxy in front of us, else our own.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Keep an incoming request id (from a load balancer), otherwise create one.
map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

upstream django {
    server backend:8000;
}

server {
    listen 8080;
    server_tokens off;                 # don't advertise the nginx version
    client_max_body_size 2m;           # the API takes small JSON bodies only

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Container health check for nginx itself.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # --- Django: API, admin, and the admin/API-docs static files (served by WhiteNoise) ---
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Request-ID $req_id;
        proxy_read_timeout 60s;
    }

    # --- The React build: hashed file names never change, so cache them for a year ---
    location /assets/ {
        root /usr/share/nginx/html;
        # One Cache-Control header (nginx's `expires` would add a second one).
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # --- Every other path is a React route: always answer with index.html ---
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        # index.html must never be cached, or users keep loading an old app after a deploy.
        add_header Cache-Control "no-cache" always;
        # Strict content security policy for the app: only our own scripts and styles,
        # API calls to our own origin, no framing, no plugins.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
