# Continuous integration: every push and pull request must pass these checks before merge.
#   backend   lint, migrations in sync, full test suite on real PostgreSQL + Redis
#   frontend  type-check and production build
#   images    both production Docker images build (nothing is pushed anywhere)
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: invoice_automation
          POSTGRES_USER: invoice_app
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U invoice_app -d invoice_automation"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      POSTGRES_DB: invoice_automation
      POSTGRES_USER: invoice_app
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - name: Lint and formatting
        run: ruff check . && ruff format --check .
      - name: Migrations are in sync with the models
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SECRET_KEY: ci-only-not-secret
      - name: Tests (includes the production settings / deploy checks)
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check and production build
        run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build production backend image
        run: docker build --target prod -t invoice-automation-backend:ci backend
      - name: Build production web image
        run: docker build -t invoice-automation-web:ci frontend
