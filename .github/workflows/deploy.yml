# Continuous deployment: after CI passes on main, build the production images, push them
# to GitHub Container Registry (ghcr.io), and roll them out on the server over SSH.
#
#   push to main -> CI passes -> this workflow -> images ghcr.io/<owner>/...:<commit sha>
#                                              -> server: compose pull + up -d (migrate first)
#                                              -> check the public health endpoint
#
# Manual run ("Run workflow" in the Actions tab) deploys any earlier commit: that is how you
# roll back. Setup (server, secrets, variables): docs/deployment.md, "GitHub Actions".
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Commit SHA to deploy (empty = latest main). Use an older SHA to roll back."
        required: false

# Never two deploys at once; a newer one waits for the running one instead of cancelling
# it halfway (a half-finished deploy is worse than a slow one).
concurrency:
  group: deploy-production
  cancel-in-progress: false

# Least privilege: nothing by default; each job asks only for what it needs.
permissions: {}

jobs:
  images:
    # Only when CI succeeded (workflow_run also fires on failure) or on a manual run.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push images to ghcr.io
    outputs:
      version: ${{ steps.version.outputs.sha }}
      backend_image: ${{ steps.names.outputs.backend }}
      web_image: ${{ steps.names.outputs.web }}
    steps:
      - name: Which commit
        id: version
        # Passed through env, never pasted into the script: a typed-in "version" must not
        # be able to run commands. And it must look like a commit SHA.
        env:
          REQUESTED: ${{ inputs.version || github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [[ ! "$REQUESTED" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "Not a commit SHA: $REQUESTED" >&2
            exit 1
          fi
          echo "sha=$REQUESTED" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.sha }}

      - name: Image names (registry paths must be lowercase)
        id: names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "backend=ghcr.io/${owner}/invoice-automation-backend" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${owner}/invoice-automation-web" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: prod
          push: true
          tags: ${{ steps.names.outputs.backend }}:${{ steps.version.outputs.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ steps.names.outputs.web }}:${{ steps.version.outputs.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # the server pulls the images with this run's token
    # A GitHub "environment": holds the deploy secrets, and can require a person to
    # approve each production deploy (Settings -> Environments -> production).
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    env:
      VERSION: ${{ needs.images.outputs.version }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/invoice-automation' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.images.outputs.version }}
          sparse-checkout: docker-compose.prod.yml
          sparse-checkout-cone-mode: false

      - name: Set up SSH (pinned host key, no "accept anything")
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host server
            HostName ${{ secrets.SSH_HOST }}
            User ${{ secrets.SSH_USER }}
            Port ${{ vars.SSH_PORT || 22 }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking yes
          EOF

      - name: Copy the compose file for this version
        run: scp docker-compose.prod.yml server:"$DEPLOY_PATH/docker-compose.prod.yml"

      - name: Pull and start the new version
        run: |
          ssh server bash -s <<EOF
          set -euo pipefail
          cd "$DEPLOY_PATH"
          # Short-lived token of THIS workflow run: lets the server pull private images now,
          # and expires when the run ends (nothing long-lived is stored on the server).
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          export APP_VERSION="$VERSION"
          export BACKEND_IMAGE="${{ needs.images.outputs.backend_image }}"
          export WEB_IMAGE="${{ needs.images.outputs.web_image }}"
          compose="docker compose -f docker-compose.prod.yml --env-file .env.prod"
          \$compose pull --quiet
          # migrate runs first (depends_on); backend/web are replaced once healthy.
          \$compose up -d --no-build --remove-orphans
          docker logout ghcr.io
          # Keep the disk from filling up with old images (the last 2 days stay for rollback).
          docker image prune -af --filter "until=48h" > /dev/null
          EOF

      - name: Check the live site
        run: |
          for attempt in $(seq 1 30); do
            body=$(curl -fsS "${{ vars.APP_URL }}/api/v1/health/" || true)
            if echo "$body" | grep -q "\"version\":\"$VERSION\"" && echo "$body" | grep -q '"status":"ok"'; then
              echo "Live and healthy: $body"
              exit 0
            fi
            sleep 10
          done
          echo "The new version did not become healthy. Last answer: $body"
          exit 1

      - name: Remove the SSH key from the runner
        if: always()
        run: rm -f ~/.ssh/deploy_key
